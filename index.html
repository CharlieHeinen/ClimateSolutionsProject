<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>

</head>

<body>

    <div id="main-container">
    
        <div class="centered" style="width:90%">
            <div id="title">
                <h1>Title goes here</h1>

                <p>Subheadings go here</p>
            </div>
        </div>
        
        <div class="centered">
            <textarea id="main-textbox" placeholder="Type something here..."></textarea>
        </div>

        <div class="centered">
            <button id="button">✨Generate Response</button>
        </div>

        <div class="centered">
            <div id="response">
                My response will show up here!
            </div>
        </div>

        <div class="centered">

            <div id="stats">

                <div style="font-size:32px;font-weight:bold;">Stats: </div>
                <br>

                <div>
                    Your data set has <span id="stat-dataset-size">#</span> Things in it!
                </div>

                <div>
                    Your response generated # emissions
                </div>

            </div>

        </div>


        <div class="centered" style="margin-top:50px">

            <details open="true">

            <summary>
                Settings:
            </summary>

            <div id="settings">

                <div class="setting">
                    <label>
                        Test Setting
                    </label>

                    <input type="number" value=0 id="setting-test">

                </div>

                <div class="setting">
                    <label>
                        Dataset Size Multiplier
                    </label>

                    <input type="number" value=1 id="setting-dataset-size">

                </div>

            </div>

        </div>

        <div class="centered" style="margin-top:50px">

            <details>

            <summary>
                Dataset:
            </summary>

                <div id="dataset">

                    <div class="dataset-entry"> 

                        <div class ="dataset-response">
                            <textarea>Responses go here</textarea>
                        </div>

                        <div class="dataset-keywords">
                            <textarea>Key, words, separeted, by, commas, go, here</textarea>
                        </div>

                    </div>

                </div>
            </details>
        </div>

        <div style="height: 100px;">

        </div>
        
    </div>

</body>


</html>
