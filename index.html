<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>

</head>

<body>

    <div id="main-container">
    
        <div class="centered">
            <textarea id="main-textbox" placeholder="Type something here..."></textarea>
        </div>

        <div class="centered">
            <button id="button">✨Generate Response</button>
        </div>

        <div class="centered">

            <details>

            <summary>
                Dataset:
            </summary>

                <div id="dataset">

                    <div class="dataset-entry"> 

                        <div class ="dataset-response">
                            <textarea>Responses go here</textarea>
                        </div>

                        <div class="dataset-keywords">
                            <textarea>Key, words, separeted, by, commas, go, here</textarea>
                        </div>

                    </div>

                </div>
            </details>
        </div>

        <div class="centered" style="margin-top:50px">

            <details open="true">

            <summary>
                Settings:
            </summary>

            <div id="settings">

                <div class="setting">
                    <label>
                        Test Setting
                    </label>

                    <input type="number" value=0 id="setting-test">

                </div>

                <div class="setting">
                    <label>
                        Test Setting 2
                    </label>

                    <input type="number" value=0 id="setting-test-2">

                </div>

            </div>

        </div>
        
    </div>

</body>


</html>
